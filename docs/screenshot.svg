<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Zone of Avoidance map</title>
  <desc id="desc">A dark sky map with a glowing Milky Way band, a central masked gap, and coloured measured galaxy points.</desc>
  <defs>
    <radialGradient id="space"><stop stop-color="#18234a"/><stop offset="1" stop-color="#03050f"/></radialGradient>
    <linearGradient id="band"><stop stop-color="#5f5cff" stop-opacity=".05"/><stop offset=".5" stop-color="#94a4ff" stop-opacity=".72"/><stop offset="1" stop-color="#5f5cff" stop-opacity=".05"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#space)"/>
  <ellipse cx="600" cy="340" rx="570" ry="70" fill="url(#band)" filter="url(#glow)"/>
  <path d="M0 350 Q300 300 600 350 T1200 350" fill="none" stroke="#bfcaff" stroke-opacity=".25" stroke-width="44"/>
  <path d="M0 350 Q300 300 600 350 T1200 350" fill="none" stroke="#050916" stroke-width="30"/>
  <g fill="#dce8ff" opacity=".85"><circle cx="105" cy="150" r="3"/><circle cx="180" cy="260" r="2"/><circle cx="270" cy="95" r="3"/><circle cx="350" cy="210" r="2"/><circle cx="470" cy="120" r="4"/><circle cx="720" cy="110" r="3"/><circle cx="820" cy="245" r="2"/><circle cx="940" cy="125" r="3"/><circle cx="1080" cy="230" r="2"/><circle cx="1125" cy="490" r="3"/><circle cx="920" cy="550" r="2"/><circle cx="740" cy="510" r="3"/><circle cx="420" cy="540" r="2"/><circle cx="200" cy="470" r="3"/></g>
  <g fill="none" stroke="#73d2ff" stroke-width="2" opacity=".85"><circle cx="180" cy="180" r="5"/><circle cx="315" cy="160" r="4"/><circle cx="455" cy="245" r="5"/><circle cx="760" cy="180" r="5"/><circle cx="890" cy="285" r="4"/><circle cx="1040" cy="180" r="5"/><circle cx="270" cy="500" r="4"/><circle cx="520" cy="535" r="5"/><circle cx="850" cy="485" r="5"/><circle cx="1030" cy="520" r="4"/></g>
  <text x="48" y="76" fill="#eef2ff" font-family="system-ui,sans-serif" font-size="26" letter-spacing="4">ZONE OF AVOIDANCE</text>
  <text x="48" y="112" fill="#aab7df" font-family="system-ui,sans-serif" font-size="16">2MRS measured galaxies • synthetic estimates are hollow</text>
  <rect x="48" y="610" width="1104" height="3" rx="2" fill="#9ba8ff" opacity=".7"/>
</svg>
